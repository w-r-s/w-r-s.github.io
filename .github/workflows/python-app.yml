name: Get Citation and Stars Data

# 关键：允许 GitHub Actions 有 push 权限
permissions:
  contents: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 0,2-6'  # Stars：周二至周日 06:17 UTC
    - cron: '43 6 * * 1'      # Stars + Scholar：每周一 06:43 UTC
  workflow_dispatch:

concurrency:
  group: homepage-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: python -m pip install -r ./assets/requirements.txt

    - name: Update GitHub stars
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: timeout 180s python ./assets/get_scholar_github.py github

    - name: Update Google Scholar citations
      id: scholar
      if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 6 * * 1'
      continue-on-error: true
      env:
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      run: timeout 90s python ./assets/get_scholar_github.py scholar

    - name: Report Google Scholar update failure
      if: steps.scholar.outcome == 'failure'
      run: echo "::warning title=Google Scholar update failed::The existing citation badge was preserved. Configure SERPAPI_KEY for reliable updates."

    - name: Update homepage timestamp
      run: |
        updated_at="$(TZ=Asia/Shanghai date '+%B %-d, %Y')"
        badge_cache="$(TZ=Asia/Shanghai date '+%Y%m%d')"
        sed -i -E "s#<!-- LAST_UPDATED_START -->.*<!-- LAST_UPDATED_END -->#<!-- LAST_UPDATED_START -->${updated_at}<!-- LAST_UPDATED_END -->#" index.html
        sed -i -E "s#(&cacheSeconds=3600&v=)[0-9]{8}#\1${badge_cache}#g" index.html

    - name: Commit and Push changes
      run: |
        git config --global user.email "wrs6@88.com"
        git config --global user.name "w-r-s"

        git add ./assets index.html
        git commit -m "* update $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

        git pull --rebase origin main
        git push origin HEAD:main
