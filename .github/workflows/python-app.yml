name: Get Citation and Stars Data

# 关键：允许 GitHub Actions 有 push 权限
permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 * * 1'  # 每周一 06:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-setuptools
        pip3 install -r ./assets/requirements.txt

    - name: Run update script (with 70s overall timeout)
      run: |
        # 防止脚本因为内部卡死导致整个 CI 超时
        timeout 70s python3 ./assets/get_scholar_github.py || echo "脚本超时，继续执行"

    - name: Commit and Push changes
      run: |
        git config --global user.email "wrs6@88.com"
        git config --global user.name "w-r-s"

        git add ./assets
        git commit -m "* update $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

        # 使用 GitHub Token 推送（避免 403 权限错误）
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/w-r-s/w-r-s.github.io.git
